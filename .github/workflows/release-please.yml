# Keeps a release pull request open from the Conventional Commits merged on main (pom.xml versions,
# CHANGELOG.md). Merging it tags v<version> and creates the GitHub Release.
#
# A tag pushed with GITHUB_TOKEN starts no workflow, so the release job dispatches ci.yml on the new
# tag itself: the organisation pipeline (krizaka/.github maven.yml) then verifies, signs and uploads
# to the Central Portal, where the deployment waits for a human to press Publish (autoPublish=false
# in krizaka-parent).
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      # Fail BEFORE the tag: a pin of the org maven.yml older than be08be83 cannot write to GitHub Packages (403 after the tag, a dead tag).
      - uses: krizaka/.github/actions/maven-pin-guard@a30e6939c7ac95121daa6aebb63f9f4531a53240 # main

      # A pull request made with GITHUB_TOKEN starts no workflow, so the release PR would never get its required checks.
      # A GitHub App installation token does (org variable RELEASE_APP_ID, org secret RELEASE_APP_PRIVATE_KEY).
      - id: app
        if: ${{ vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Release the tag to Maven Central
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
