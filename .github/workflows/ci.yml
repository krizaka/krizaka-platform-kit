# Verifies the platform kit (unit tests, auto-configuration tests, javadoc, sources) on every change (with the release profile, unsigned), and on a
# v* tag signs them and uploads them to Maven Central. The pipeline is the organisation's:
# krizaka/.github/.github/workflows/maven.yml.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  maven:
    uses: krizaka/.github/.github/workflows/maven.yml@f182d162d3446f254433714bc6f155d55a2e4084 # main
    with:
      upstreams: "krizaka-build"
      rewrite: true
      threads: "2"
      sonar: true   # CI analysis with JaCoCo coverage; the merge queue branch is analysed too
    secrets: inherit
