# Verifies the platform kit (unit tests, auto-configuration tests, javadoc, sources) on every change (with the release profile, unsigned), and on a
# v* tag signs them and uploads them to Maven Central. The pipeline is the organisation's:
# krizaka/.github/.github/workflows/maven.yml.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  maven:
    permissions:
      contents: read
      packages: write
    uses: krizaka/.github/.github/workflows/maven.yml@be08be836bcce567d84a679d3f40aefab79ca4cc # main
    with:
      registry: github   # GitHub Packages (ADR-019): krizaka-parent and the BOM resolve from there, no upstream checkout
      rewrite: true
      threads: "2"
      sonar: true   # CI analysis with JaCoCo coverage; the merge queue branch is analysed too
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
