# Verifies the platform kit (unit tests, auto-configuration tests, javadoc, sources) on every change (with the release profile, unsigned), and on a
# v* tag signs them and uploads them to Maven Central. The pipeline is the organisation's:
# krizaka/.github/.github/workflows/maven.yml.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  maven:
    uses: krizaka/.github/.github/workflows/maven.yml@6f09de86398ea1cecc323dc93b62ee496adb7d84 # main
    with:
      upstreams: "krizaka-build"
      rewrite: true
    secrets: inherit
