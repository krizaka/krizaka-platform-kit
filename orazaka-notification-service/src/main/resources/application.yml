spring:
  application:
    name: orazaka-notification-service
  # Loom: AGENTS.md §4. AMQP-first, but SMTP and HTTP delivery are blocking I/O all the same.
  threads:
    virtual:
      enabled: true

  # E-mail channel. Locally: the Mailpit container of the workspace docker-compose
  # (SMTP :1025, inbox http://localhost:8025). Elsewhere: any SMTP relay.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
        acknowledge-mode: auto
        default-requeue-rejected: false
        # Exponential backoff (AGENTS.md §6); exhausted retries dead-letter to <queue>.dlq.
        retry:
          enabled: true
          max-attempts: ${RABBITMQ_RETRY_MAX_ATTEMPTS:3}
          initial-interval: ${RABBITMQ_RETRY_INITIAL_INTERVAL:1s}
          multiplier: 2.0
          max-interval: 10s

server:
  port: ${NOTIFICATIONS_PORT:8097}

management:
  endpoints:
    web:
      exposure:
        # health for the harness's readiness gate, info for its identity check (ADR-071 §2).
        include: health, info
  otlp:
    tracing:
      endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  file:
    name: ${ORAZAKA_NOTIFICATIONS_LOG:var/logs/notification-service.log}
  logback:
    rollingpolicy:
      max-file-size: 1MB
      total-size-cap: 10MB
      max-history: 7

# ── Orazaka — service-owned wiring ────────────────────────────────────────────
orazaka:
  notifications:
    from-address: ${NOTIFICATIONS_FROM:Orazaka <no-reply@krizaka.com>}
    # Override to brand the templates without a rebuild, e.g. file:/etc/orazaka/templates/
    template-location: ${NOTIFICATIONS_TEMPLATES:classpath:templates/}
    links:
      verify-email: ${NOTIFICATIONS_VERIFY_EMAIL_URL:http://localhost:3000/verify?token={token}}
      reset-password: ${NOTIFICATIONS_RESET_PASSWORD_URL:http://localhost:3000/reset-password?token={token}}
    twilio:
      # Blank account SID = SMS channel not configured (requests for it are dead-lettered).
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
    webhook:
      # Comma-separated host names a webhook may target. Empty = webhook channel disabled.
      allowed-hosts: ${NOTIFICATIONS_WEBHOOK_ALLOWED_HOSTS:}
